<!-- SECTION : HERO -->
<section class="hero d-flex justify-content-center align-items-center">
    <h1>CONTACT</h1>
</section>

<!-- SECTION : CONTACT FORM -->
<section class="container-form bg-primary py-5">
    <div class="bg-tertiary w-75 mx-auto rounded-3 p-4 p-md-5 border border-dark">
        <form>
            <div class="mb-3">
                <label for="InputTitle" class="form-label">Titre :</label>
                <input type="text" name="title" class="form-control" id="InputTitle" placeholder="Sujet">
                <div class="invalid-feedback">
                    Ce champ est requis.
                </div>
            </div>
            <div class="mb-3"">
                <label for=" InputEmail" class="form-label">Email :</label>
                <input type="email" name="emailform" class="form-control" id="InputEmail" placeholder="votre-email@mail.com">
                <div class="invalid-feedback">
                    Veuillez entrer une adresse e-mail valide.
                </div>
            </div>
            <div class="mb-3">
                <label for="FormControlMessageContact" class="form-label">Message :</label>
                <textarea class="form-control" name="message" id="FormControlMessageContact" rows="py-3" placeholder="Bonjour..."></textarea>
                <div class="invalid-feedback">
                    Ce champ est requis.
                </div>
            </div>
            <div class="text-center">
                <button type="submit" id="btn-contact-form" class="btn btn-black">Soumettre</button>
            </div>
        </form>
    </div>
</section>
