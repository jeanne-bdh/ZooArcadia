<!-- SECTION : HERO -->
<section class="hero d-flex justify-content-center align-items-center">
    <h1>Rédigez un avis</h1>
</section>

<!-- SECTION : REVIEW FORM -->
<section class="container-back bg-primary mx-auto py-5">
    <div class="bg-tertiary w-75 mx-auto rounded-3 p-4 p-md-5 border border-dark">
        <form>
            <div class="mb-3">
                <label for="InputPseudo" class="form-label">Pseudo :</label>
                <input type="text" name="pseudo" class="form-control" id="InputPseudo" placeholder="pseudo">
                <div class="invalid-feedback">
                    Ce champ est requis.
                </div>
            </div>

            <!-- 5 STARS RADIO -->
            <div class="pt-3 mb-3">
                <fieldset>
                    <legend class="form-label">Votre note :</label>
                        <div class="d-flex justify-content-center justify-content-md-start">
                            <input type="radio" class="btn-check" name="rating" id="star1" value="1">
                            <label class="btn btn-outline-warning" for="star1"><i class="bi bi-star"></i></label>

                            <input type="radio" class="btn-check" name="rating" id="star2" value="2">
                            <label class="btn btn-outline-warning" for="star2"><i class="bi bi-star"></i></label>

                            <input type="radio" class="btn-check" name="rating" id="star3" value="3">
                            <label class="btn btn-outline-warning" for="star3"><i class="bi bi-star"></i></label>

                            <input type="radio" class="btn-check" name="rating" id="star4" value="4">
                            <label class="btn btn-outline-warning" for="star4"><i class="bi bi-star"></i></label>

                            <input type="radio" class="btn-check" name="rating" id="star5" value="5">
                            <label class="btn btn-outline-warning" for="star5"><i class="bi bi-star"></i></label>
                        </div>
                </fieldset>
            </div>

            <div class="mb-3 pb-3">
                <label for="FormControlMessageAvis" class="form-label">Votre avis :</label>
                <textarea class="form-control" name="textavis" id="FormControlMessageAvis" rows="py-3"
                    placeholder="Racontez-nous votre expérience"></textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-black" id="btn-review">Soumettre</button>
            </div>
        </form>
    </div>
</section>
