<!-- SECTION : HERO -->
<section class="hero px-3 text-center d-flex justify-content-center align-items-center">
    <h1>Modifier les animaux</h1>
</section>

<!-- SECTION : CREATE ANIMALS -->
<section class="container">
    <form class="row m-3 m-md-5">
        <div class="mb-3">
            <label for="animalInput" class="form-label">Espèce</label>
            <select class="form-select" aria-label="Sélection espèce">
                <option selected>-- Sélectionner une espèce --</option>
                <option value="1">Capybara</option>
                <option value="2">Gorille</option>
                <option value="3">Iguane</option>
                <option value="4">Paresseux</option>
                <option value="5">Tigre</option>
                <option value="6">Toucan</option>
                <option value="7">Crocodile</option>
                <option value="8">Grenouille</option>
                <option value="9">Héron</option>
                <option value="10">Loutre</option>
                <option value="11">Serpent</option>
                <option value="12">Tortue</option>
                <option value="13">Babouin</option>
                <option value="14">Eléphant</option>
                <option value="15">Girafe</option>
                <option value="16">Lion</option>
                <option value="17">Rhinocéros</option>
                <option value="18">Zèbre</option>
                <option value="19">Ajouter une espèce</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="breedInput" class="form-label">Race</label>
            <select class="form-select" aria-label="Sélection race">
                <option selected>-- Sélectionner une race --</option>
                <option value="1">Crocodile des indes</option>
                <option value="2">Ajouter une race</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="habitatInput" class="form-label">Habitat</label>
            <select class="form-select" aria-label="Sélection habitat">
                <option selected>-- Sélectionner un habitat --</option>
                <option value="1">Savane</option>
                <option value="2">Jungle</option>
                <option value="3">Marais</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="nameInput" class="form-label">Prénom</label>
            <input class="form-control" id="nameInput"></input>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-black mt-3">Ajouter</button>
        </div>
    </form>
</section>

<!-- SECTION : READ UPDATE DELETE ANIMALS -->
<section class="table-responsive my-5 mx-3 mx-md-5">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th scope="col">Espèce</th>
                <th scope="col">Race</th>
                <th scope="col">Habitat</th>
                <th scope="col">Prénom</th>
                <th scope="col" class="text-center">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Crocodile</td>
                <td>Crocodile des indes</td>
                <td>Marais</td>
                <td>Gaby</td>
                <td class="text-center">
                    <button type="button" class="btn">✏️</button>
                    <button type="button" class="btn">🗑️</button>
                </td>
            </tr>
        </tbody>
    </table>
</section>
