<!-- SECTION : HERO -->
<section class="hero px-3 text-center d-flex justify-content-center align-items-center">
    <h1>Modifier les horaires</h1>
</section>

<!-- SECTION : UPDATE HOURS -->
<section class="container">
    <form class="row m-3 m-md-5">
        <div class="mb-3">
            <label for="dayInput" class="form-label">Jours de la semaine</label>
            <select class="form-select" aria-label="Sélection du jour" id="dayInput" name="dayInput" required>
                <option value="" selected>-- Sélectionner un jour --</option>
                <option value="1">Lundi</option>
                <option value="2">Mardi</option>
                <option value="3">Mercredi</option>
                <option value="4">Jeudi</option>
                <option value="5">Vendredi</option>
                <option value="6">Samedi</option>
                <option value="7">Dimanche</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="openingHours" class="form-label">Heure d'ouverture</label>
            <input type="time" class="form-control" id="openingHours"></input>
        </div>
        <div class="mb-3">
            <label for="closingHours" class="form-label">Heure de fermeture</label>
            <input type="time" class="form-control" id="closingHours"></input>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-black mt-3" id="btn-hours">Mettre à jour</button>
        </div>
    </form>
</section>

<!-- SECTION : HOURS LIST -->
<section class="table-responsive my-5 mx-3 mx-md-5">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th scope="col">Jour</th>
                <th scope="col" class="text-center">Ouverture</th>
                <th scope="col" class="text-center">Fermeture</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Lundi</td>
                <td class="text-center">00:00</td>
                <td class="text-center">00:00</td>
            </tr>
            <tr>
                <td>Mardi</td>
                <td class="text-center">09:00</td>
                <td class="text-center">18:00</td>
            </tr>
            <tr>
                <td>Mercredi</td>
                <td class="text-center">09:00</td>
                <td class="text-center">18:00</td>
            </tr>
            <tr>
                <td>Jeudi</td>
                <td class="text-center">09:00</td>
                <td class="text-center">18:00</td>
            </tr>
            <tr>
                <td>Vendredi</td>
                <td class="text-center">09:00</td>
                <td class="text-center">18:00</td>
            </tr>
            <tr>
                <td>Samedi</td>
                <td class="text-center">09:00</td>
                <td class="text-center">18:00</td>
            </tr>
            <tr>
                <td>Dimanche</td>
                <td class="text-center">09:00</td>
                <td class="text-center">18:00</td>
            </tr>
        </tbody>
    </table>
</section>
