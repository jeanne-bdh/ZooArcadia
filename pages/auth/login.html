<!-- SECTION : HERO -->
<section class="hero d-flex justify-content-center align-items-center">
    <h1>Bienvenue sur votre <br> espace de connexion</h1>
</section>

<!-- SECTION : LOGIN FORM -->
<section class="container-back bg-primary py-5 mx-auto">
    <div class="bg-tertiary w-75 mx-auto rounded-3 p-4 p-md-5 border border-dark">
            <h4 class="text-center text-dark">CONNEXION</h4>

            <form action="" method="POST">
                <div class="my-4">
                    <label for="emailInputCo" class="form-label">Email :</label>
                    <input type="email" name="email" class="form-control" id="emailInputCo" autocomplete="on" required></input>
                    <div class="invalid-feedback">
                        Veuillez entrer une adresse e-mail valide
                    </div>
                    <div class="valid-feedback">
                        L'adresse e-mail est valide
                    </div>
                </div>
                <div class="mb-4">
                    <label for="passwordInputCo" class="form-label">Mot de passe :</label>
                    <input type="password" name="password" class="form-control" id="passwordInputCo" autocomplete="off" required></input>
                    <div class="invalid-feedback">
                        Le mot de passe doit contenir au moins 8 caractères comprenant une lettre majuscule, une
                        minuscule, un chiffre et un caractère
                        spécial
                    </div>
                    <div class="valid-feedback">
                        Le mot de passe est valide
                    </div>
                </div>
                <div class="text-center">
                    <button type="button" class="btn btn-black" id="btn-validCo">Se connecter</button>
                </div>
            </form>

    </div>
</section>
