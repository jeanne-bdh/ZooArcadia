<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Zoo - Dashboard Graphique</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f2f7f4;
        }

        h1 {
            color: #2e7d32;
        }

        .section {
            margin-bottom: 40px;
        }

        .animal-list button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #a5d6a7;
            color: #1b5e20;
            transition: background-color 0.2s;
        }

        .animal-list button:hover {
            background-color: #81c784;
        }

        canvas {
            border: 1px solid #ccc;
            background-color: white;
            width: 100%;
            max-width: 600px;
            height: 300px;
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="section">
        <h1>🐾 Visiteur : Cliquez sur un animal</h1>
        <div class="animal-list">
            <button onclick="viewAnimal('Médor')">🐶 Médor</button>
            <button onclick="viewAnimal('Tigra')">🐯 Tigra</button>
            <button onclick="viewAnimal('Balthazar')">🦍 Balthazar</button>
        </div>
    </div>

    <div class="section">
        <h1>📊 Dashboard Admin – Consultations par animal</h1>
        <canvas id="barChart" width="600" height="300"></canvas>
    </div>

    <script>
        function viewAnimal(name) {
            const views = JSON.parse(localStorage.getItem('views') || '{}');

            if (!views[name]) {
                views[name] = 0;
            }

            views[name]++;
            localStorage.setItem('views', JSON.stringify(views));

            alert(`Vous avez consulté ${name} (${views[name]} fois au total)`);
            drawChart();
        }

        function drawChart() {
            const canvas = document.getElementById('barChart');
            const ctx = canvas.getContext('2d');
            const views = JSON.parse(localStorage.getItem('views') || '{}');

            const width = canvas.width;
            const height = canvas.height;

            // Nettoyer le canvas
            ctx.clearRect(0, 0, width, height);

            // Paramètres du graphique
            const keys = Object.keys(views);
            const values = Object.values(views);
            const barWidth = 50;
            const barGap = 30;
            const maxVal = Math.max(...values, 1); // éviter division par 0
            const chartHeight = height - 40;

            ctx.font = "14px Arial";

            keys.forEach((animal, i) => {
                const x = 50 + i * (barWidth + barGap);
                const barHeight = (views[animal] / maxVal) * chartHeight;
                const y = height - barHeight - 20;

                // Barres
                ctx.fillStyle = "#4caf50";
                ctx.fillRect(x, y, barWidth, barHeight);

                // Nom animal
                ctx.fillStyle = "#000";
                ctx.textAlign = "center";
                ctx.fillText(animal, x + barWidth / 2, height - 5);

                // Valeur
                ctx.fillText(views[animal], x + barWidth / 2, y - 10);
            });
        }

        // Affiche au chargement
        drawChart();
    </script>

</body>

</html>
