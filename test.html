<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace Admin - Zoo</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
            background-color: #f9f9f9;
        }

        h1 {
            text-align: center;
        }

        form {
            background: #fff;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-width: 400px;
            margin: 1rem auto;
        }

        input,
        select,
        button {
            display: block;
            width: 100%;
            margin-bottom: 1rem;
            padding: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 0.75rem;
            text-align: center;
        }

        .actions button {
            margin: 0 0.25rem;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Espace Administrateur - Gestion des Animaux</h1>

    <form id="animal-form">
        <input type="hidden" id="editIndex" value="">
        <input type="text" id="name" placeholder="Nom de l'animal" required />
        <input type="text" id="species" placeholder="Espèce" required />
        <input type="text" id="habitat" placeholder="Habitat" required />
        <button type="submit">Ajouter / Mettre à jour</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Espèce</th>
                <th>Habitat</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="animal-table-body">
            <!-- Les lignes seront générées dynamiquement -->
        </tbody>
    </table>

    <script>
        const form = document.getElementById('animal-form');
        const nameInput = document.getElementById('name');
        const speciesInput = document.getElementById('species');
        const habitatInput = document.getElementById('habitat');
        const editIndexInput = document.getElementById('editIndex');
        const tableBody = document.getElementById('animal-table-body');

        let animals = [];

        function renderTable() {
            tableBody.innerHTML = '';
            animals.forEach((animal, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
          <td>${animal.name}</td>
          <td>${animal.species}</td>
          <td>${animal.habitat}</td>
          <td class="actions">
            <button onclick="editAnimal(${index})">✏️</button>
            <button onclick="deleteAnimal(${index})">🗑️</button>
          </td>
        `;
                tableBody.appendChild(row);
            });
        }

        function editAnimal(index) {
            const animal = animals[index];
            nameInput.value = animal.name;
            speciesInput.value = animal.species;
            habitatInput.value = animal.habitat;
            editIndexInput.value = index;
        }

        function deleteAnimal(index) {
            if (confirm("Supprimer cet animal ?")) {
                animals.splice(index, 1);
                renderTable();
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            const species = speciesInput.value.trim();
            const habitat = habitatInput.value.trim();
            const editIndex = editIndexInput.value;

            if (editIndex === '') {
                animals.push({ name, species, habitat });
            } else {
                animals[editIndex] = { name, species, habitat };
                editIndexInput.value = '';
            }

            form.reset();
            renderTable();
        });

        // Initial data (optional)
        animals = [
            { name: "Leo", species: "Lion", habitat: "Savane" },
            { name: "Kiki", species: "Toucan", habitat: "Jungle tropicale" }
        ];
        renderTable();
    </script>

</body>

</html>
